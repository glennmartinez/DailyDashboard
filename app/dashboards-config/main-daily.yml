# File: app/dashboards/main-daily.yml
name: "Main Daily Dashboard"
description: "Daily team metrics and status"
widgets:
  - id: "motivational1"
    type: "motivational"
    position:
      row: 0
      col: 6
      width: 4
    config: {}
  - id: "milestone1"
    type: "milestone"
    position:
      row: 0
      col: 0
      width: 5
    config:
      owner: "glennmartinez"
      repo: "habito-mobile"
      projectNumber: 1
  - id: "time1"
    type: "time"
    position:
      row: 0 # Adjust row as needed
      col: 0 # Adjust column as needed
      width: 3 # Using our configured default width
    config: {} # No configu
  - id: "sprint1"
    type: "sprint"
    position:
      row: 1
      col: 0
      width: 6
    config:
      owner: "glennmartinez"
      repos: ["repo1"]
      projectNumber: 7
  - id: "issues1"
    type: "issues-analytics"
    position:
      row: 1
      col: 6
      width: 6
    config:
      owner: "glennmartinez"
      repo: "habito-mobile"
      timeRange: "month"
  - id: "health1"
    type: "repo-health"
    position:
      row: 2
      col: 0
      width: 6
    config:
      owner: "glennmartinez"
      repo: "habito-mobile"
  - id: "workflow1"
    type: "workflow-builds"
    position:
      row: 2
      col: 6
      width: 6
    config:
      owner: "glennmartinez"
      repo: "habito-mobile"
  - id: "tree-coverage1"
    type: "tree-coverage"
    position:
      row: 3
      col: 0
      width: 12 # Full width for better table display
    config:
      owner: "glennmartinez"
      repo: "habito-mobile"
      branch: "main" # Optional, defaults to 'main' if not specified
  - id: "serpentine-chart1"
    type: "serpentine-chart"
    position:
      row: 4 # Positioned right after tree-coverage
      col: 0
      width: 12 # Using width defined in registry
    config:
      title: "Project Timeline Q1 2023" # Custom title
